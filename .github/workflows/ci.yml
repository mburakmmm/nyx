name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v1.10.0 sh
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          path = "nox.json"
          data = {
            "name": "nyx",
            "entry": "examples/blog/main.nox",
            "requires": [{
              "alias": "nyx",
              "repo": os.environ["GITHUB_WORKSPACE"],
              "ref": "master",
            }],
          }
          with open(path, "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          # Run every test file: bare `noxc test` can under-report when a
          # dependency segfaults mid-suite (Nox 1.10 package codegen edge cases).
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"
