name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3

      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe

      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
              },
            ],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
                "resolved": sha,
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"

  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nyx
          POSTGRES_USER: nyx
          POSTGRES_DB: nyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyx -d nyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3
      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe
      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
              },
            ],
          }
          open("nox.json","w").write(json.dumps(data, indent=2)+"\n")
          lock = {
            "packages": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
                "resolved": sha,
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          open("nox.lock","w").write(json.dumps(lock, indent=2)+"\n")
          PY
      - name: PG session + auth smoke + e2e
        env:
          DATABASE_URL: postgres://nyx:nyx@127.0.0.1:5432/nyx
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
          noxc --version
          noxc fetch
          noxc run ci/pg_smoke.nox
          noxc test tests/v152_pg_session_e2e_test.nox
          noxc test tests/v271_migrate_dialect_test.nox
          noxc test tests/v272_db_pool_test.nox
