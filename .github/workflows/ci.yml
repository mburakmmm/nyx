name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3

      - name: Install Nox
        run: |
          # install.sh uses bash-only 'set -o pipefail'; must not pipe to dash/sh
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v1.104.0 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [{
              "alias": "nyx",
              "repo": ws,
              "ref": "master",
            }],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [{
              "alias": "nyx",
              "repo": ws,
              "ref": "master",
              "resolved": sha,
            }]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"

  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nyx
          POSTGRES_USER: nyx
          POSTGRES_DB: nyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyx -d nyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3
      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v1.104.0 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [{
              "alias": "nyx",
              "repo": ws,
              "ref": "master",
            }],
          }
          open("nox.json","w").write(json.dumps(data, indent=2)+"\n")
          lock = {
            "packages": [{
              "alias": "nyx",
              "repo": ws,
              "ref": "master",
              "resolved": sha,
            }]
          }
          open("nox.lock","w").write(json.dumps(lock, indent=2)+"\n")
          PY
      - name: PG session + auth smoke + e2e
        env:
          DATABASE_URL: postgres://nyx:nyx@127.0.0.1:5432/nyx
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
          noxc --version
          noxc fetch
          noxc run ci/pg_smoke.nox
          noxc test tests/v152_pg_session_e2e_test.nox
