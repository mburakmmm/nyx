name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3

      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe

      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "source": "nox",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
              },
            ],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
                "resolved": sha,
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"

  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nyx
          POSTGRES_USER: nyx
          POSTGRES_DB: nyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyx -d nyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3
      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe
      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "source": "nox",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
              },
            ],
          }
          open("nox.json","w").write(json.dumps(data, indent=2)+"\n")
          lock = {
            "packages": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
                "resolved": sha,
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          open("nox.lock","w").write(json.dumps(lock, indent=2)+"\n")
          PY
      - name: PG session + auth smoke + e2e
        env:
          DATABASE_URL: postgres://nyx:nyx@127.0.0.1:5432/nyx
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
          noxc --version
          noxc fetch
          noxc run ci/pg_smoke.nox
          noxc test tests/v152_pg_session_e2e_test.nox
          noxc test tests/v271_migrate_dialect_test.nox
          noxc test tests/v272_db_pool_test.nox
          noxc test tests/v273_db_pool_race_test.nox
          noxc test tests/v278_orm_test.nox
          noxc test tests/v280_migrate_lock_race_test.nox

  mysql-smoke:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nyx
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: nyx
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3
      - name: Install MySQL client library
        run: |
          set -euo pipefail
          # The job is pinned to Ubuntu 24.04 because Nox dlopens
          # libmysqlclient.so.21 and that SONAME ships with this release.
          sudo apt-get update
          sudo apt-get install -y libmysqlclient21
          ldconfig -p | grep 'libmysqlclient.so.21'
      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe
      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "source": "nox",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
              },
            ],
          }
          open("nox.json","w").write(json.dumps(data, indent=2)+"\n")
          lock = {
            "packages": [
              {
                "alias": "nyx",
                "repo": ws,
                "ref": "master",
                "resolved": sha,
              },
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          open("nox.lock","w").write(json.dumps(lock, indent=2)+"\n")
          PY
      - name: MySQL migrate and pool
        env:
          DATABASE_URL: mysql://root:nyx@127.0.0.1:3306/nyx
        run: |
          noxc --version
          noxc fetch
          noxc test tests/v271_migrate_dialect_test.nox
          noxc test tests/v272_db_pool_test.nox
          noxc test tests/v273_db_pool_race_test.nox
          noxc test tests/v275_mysql_ddl_test.nox
          noxc test tests/v276_mysql_pool_stress_test.nox
          noxc test tests/v278_orm_test.nox
          noxc test tests/v280_migrate_lock_race_test.nox

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-macos-arm64

      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "source": "nox",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {"alias": "nyx", "repo": ws, "ref": "master"},
              {"alias": "rune", "repo": "github.com/mburakmmm/rune", "ref": "v2.0.1"},
            ],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [
              {"alias": "nyx", "repo": ws, "ref": "master", "resolved": sha},
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y
          $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          $gcc = Get-Command gcc.exe | Select-Object -ExpandProperty Source
          $dir = Split-Path $gcc
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Nox
        shell: pwsh
        env:
          NOX_VERSION: v2.1.186
        run: |
          irm https://raw.githubusercontent.com/mburakmmm/nox-lang/v2.1.186/install.ps1 | iex
          "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Point package at checkout
        shell: pwsh
        run: |
          python -c @"
          import json, os
          ws = os.environ['GITHUB_WORKSPACE']
          sha = os.environ['GITHUB_SHA']
          data = {
            'name': 'nyx',
            'source': 'nox',
            'entry': 'examples/blog/main.nox',
            'bin': {'name': 'nyx', 'path': 'cli.nox'},
            'requires': [
              {'alias': 'nyx', 'repo': ws, 'ref': 'master'},
              {'alias': 'rune', 'repo': 'github.com/mburakmmm/rune', 'ref': 'v2.0.1'},
            ],
          }
          open('nox.json','w',encoding='utf-8').write(json.dumps(data, indent=2)+'\n')
          lock = {
            'packages': [
              {'alias': 'nyx', 'repo': ws, 'ref': 'master', 'resolved': sha},
              {'alias': 'rune', 'repo': 'github.com/mburakmmm/rune', 'ref': 'v2.0.1', 'resolved': 'a4c5434563a7415cc45df687af4ac51f51085912'},
            ],
          }
          open('nox.lock','w',encoding='utf-8').write(json.dumps(lock, indent=2)+'\n')
          "@

      - name: Portable tests
        shell: pwsh
        run: |
          noxc --version
          noxc fetch
          $script:fail = 0
          Get-ChildItem tests/*.nox | ForEach-Object {
            Write-Host "==> $($_.FullName)"
            noxc test $_.FullName
            if ($LASTEXITCODE -ne 0) { $script:fail = 1 }
          }
          exit $script:fail

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl python3

      - name: Cache Nox toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nox-lang
          key: nox-v2.1.186-linux-x64-qbe

      - name: Install Nox
        run: |
          if ! "$HOME/.nox-lang/bin/noxc" --version >/dev/null 2>&1; then
            bash ci/install_nox.sh
          fi
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "nyx",
            "source": "nox",
            "entry": "examples/blog/main.nox",
            "bin": {"name": "nyx", "path": "cli.nox"},
            "requires": [
              {"alias": "nyx", "repo": ws, "ref": "master"},
              {"alias": "rune", "repo": "github.com/mburakmmm/rune", "ref": "v2.0.1"},
            ],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [
              {"alias": "nyx", "repo": ws, "ref": "master", "resolved": sha},
              {
                "alias": "rune",
                "repo": "github.com/mburakmmm/rune",
                "ref": "v2.0.1",
                "resolved": "a4c5434563a7415cc45df687af4ac51f51085912",
              },
            ]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch, test, and compile hello
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/ui/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          noxc build --target wasm32-freestanding examples/ui/hello.nox -o examples/ui/hello.wasm
          python3 - <<'PY'
          data = open("examples/ui/hello.wasm", "rb").read()
          for banned in (b"nyx.db", b"nyx.auth", b"nyx-ui-notes-secret", b"ada-pass-9"):
              if banned in data:
                  raise SystemExit(banned.decode())
          PY
          exit "$fail"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/nyx-browser"
          npm init -y --prefix "$RUNNER_TEMP/nyx-browser"
          npm install --prefix "$RUNNER_TEMP/nyx-browser" playwright
          npm exec --prefix "$RUNNER_TEMP/nyx-browser" -- playwright install --with-deps chromium

      - name: Browser
        run: |
          NYX_PLAYWRIGHT="$RUNNER_TEMP/nyx-browser/node_modules/playwright/index.mjs" node examples/ui-spike/ci-browser.mjs
